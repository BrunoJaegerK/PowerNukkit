name: PowerNukkit modernization build

on:
  push:
    branches:
      - modernization/bedrock-latest
  pull_request:
    branches:
      - modernization/bedrock-latest
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modernization-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify Maven wrapper
        run: chmod +x ./mvnw

      - name: Build and run tests
        run: ./mvnw --no-transfer-progress -B clean verify -DskipTests=false

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: powernukkit-modernization-${{ github.sha }}
          path: |
            target/*.jar
            target/surefire-reports/*.txt
          if-no-files-found: warn
          retention-days: 14
